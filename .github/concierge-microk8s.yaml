# Concierge config for the MicroK8s integration test job.
#
# Concierge installs Juju and MicroK8s, but doesn't bootstrap: the CI workflow
# runs `juju bootstrap` itself (see `Bootstrap on MicroK8s` in
# .github/workflows/ci.yml), because it needs the per-job
# --controller-charm-path. With `bootstrap: false`, concierge ignores
# `model-defaults`, `bootstrap-constraints` and `extra-bootstrap-args`.
#
# LXD isn't enabled: the charm is packed in the separate build job.
juju:
  # charmcraft.yaml declares `assumes: juju >= 4.2`.
  channel: 4.2/edge

providers:
  microk8s:
    enable: true
    bootstrap: false
    channel: 1.36-strict/stable
    addons:
      - dns
      - hostpath-storage
