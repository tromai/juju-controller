# Concierge config for the `build` job (packing the charm with charmcraft).
#
# This replaces the hand-rolled `canonical/setup-lxd` + `usermod -a -G lxd` +
# `snap install charmcraft` steps. It mirrors concierge's built-in `crafts`
# preset, trimmed to just what `charmcraft pack` needs: LXD as the build
# backend and charmcraft itself. No Juju controller is needed to pack, so Juju
# is disabled entirely.
juju:
  # Packing doesn't need a controller; skip installing/bootstrapping Juju.
  disable: true

providers:
  lxd:
    # LXD is installed as charmcraft's build backend. `bootstrap` is
    # irrelevant here because Juju is disabled above (nothing is bootstrapped),
    # but we leave it enabled/installed so charmcraft can use it.
    enable: true
    bootstrap: false

host:
  snaps:
    charmcraft:
      # Preserve the previous pin: `snap install charmcraft --classic
      # --channel=latest/stable` ("We use latest because there's no 4.x track
      # yet."). Concierge installs charmcraft with --classic automatically.
      channel: latest/stable
