name: "CI"
on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag, or SHA to build and test. Leave empty to test the ref
          this workflow is running from. Use this to test a branch that
          doesn't have this CI workflow (or tests/integration/) at all --
          dispatch from a branch that does (e.g. main) and point `ref` at
          the other branch. Only unit-tests/build check out this ref; the
          integration job checks out the workflow's own ref and only
          consumes the charm artifact built from it (see below).
        required: false
        type: string
env:
  CHARM_NAME: ${{ vars.CHARM_NAME }}
  # Ref whose charm code / pyproject.toml / charmcraft.yaml gets built and
  # unit-tested. NOT used by the integration job -- see its checkout step.
  TEST_REF: ${{ inputs.ref || github.ref }}

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    # Checks out TEST_REF (the branch under test), not necessarily this
    # workflow's own ref -- see the workflow_dispatch `ref` input above.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ env.TEST_REF }}

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.10'

    - name: Install uv
      run: pip install uv

    - name: Create uv virtualenv
      run: uv venv

    - name: Install dependencies for testing
      run: |
        source .venv/bin/activate
        uv pip install ".[dev]"

    - name: Run tests
      run: |
        source .venv/bin/activate
        ./run_tests

  build:
    name: Build charm
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      # Same as unit-tests: builds whatever charm code lives at TEST_REF.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TEST_REF }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      # NOTE: the build job checks out TEST_REF -- an arbitrary branch (or even
      # a fork) selected via the workflow_dispatch `ref` input, which may not
      # contain this repo's .github/concierge-*.yaml files. So provisioning
      # here must NOT depend on any repo file. We deliberately use concierge's
      # built-in `crafts` preset (shipped inside the concierge snap) rather
      # than a `-c <config>` file for that reason. The `crafts` preset installs
      # LXD (charmcraft's build backend), charmcraft, snapcraft and rockcraft,
      # and disables Juju -- exactly what `charmcraft pack` needs.
      - name: Install concierge
        run: sudo snap install --classic concierge

      - name: Prepare with concierge
        # --charmcraft-channel preserves the previous pin (`snap install
        # charmcraft --channel=latest/stable`; "no 4.x track yet").
        run: sudo concierge prepare -v -p crafts --charmcraft-channel latest/stable

      - name: Pack charm
        # Still wrapped in `sg lxd` so the freshly-added lxd group membership
        # is active in this shell (group changes don't apply to the current
        # login session otherwise).
        run: sg lxd -c "charmcraft pack"

      - name: Upload charm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charm
          path: "*.charm"

  integration:
    name: "Integration tests (${{ matrix.test_name }})"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: lxd-22.04
            cloud: lxd
            bootstrap_base: ubuntu@22.04
          - test_name: lxd-24.04
            cloud: lxd
            bootstrap_base: ubuntu@24.04
          - test_name: lxd-26.04
            cloud: lxd
            bootstrap_base: ubuntu@26.04
          - test_name: microk8s
            cloud: microk8s
            # CAAS bootstrap rejects --bootstrap-base entirely (it's an
            # IAAS-only flag), so this is only used below to pick which
            # packed charm artifact to upload, not passed to `juju bootstrap`.
            bootstrap_base: ubuntu@24.04
          - test_name: k8s
            cloud: k8s
            bootstrap_base: ubuntu@24.04
    # NOTE: local --controller-charm-path used to be hard-rejected on k8s
    # clouds ( "deploying a local controller charm on a k8s controller not
    # supported", see juju/juju#14586). That restriction was lifted by
    # juju/juju#22795 ("feat: bootstrap controller charm on CAAS"), which
    # landed after the 4.1-beta1 build. We install Juju from 4.1/edge below
    # to pick up that fix.

    steps:
    # NOTE: deliberately checks out the *workflow's own* ref here, not
    # ${{ env.TEST_REF }}. This job only needs tests/integration/ and the
    # `integration` extra in pyproject.toml, which live on the branch this
    # workflow file itself lives on. The actual charm under test comes
    # entirely from the `charm` artifact built by the `build` job (from
    # TEST_REF), so this job never depends on the target branch having any
    # test files.
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Download packed charm
      id: download
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: charm

    - name: Save charmcraft logs as artifact
      if: always() && steps.charmcraft.outcome != 'skipped'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: charmcraft-upload-logs-${{ matrix.test_name }}
        path: ~/.local/state/charmcraft/log/
      continue-on-error: true

    - name: Find packed charm path
      id: charm
      # The build job packs one .charm per platform declared in
      # charmcraft.yaml (e.g. juju-controller_ubuntu@22.04-amd64.charm). Pick
      # the file matching *this* matrix job's base, instead of just grabbing
      # the alphabetically-first .charm file (which would silently bootstrap
      # every base with the 22.04 build).
      run: |
        BASE="${{ matrix.bootstrap_base }}"
        CHARM_FILE="$(ls -1 juju-controller_${BASE}-*.charm | head -n1)"
        if [[ -z "$CHARM_FILE" ]]; then
          echo "No packed charm found for base ${BASE}" >&2
          ls -1 *.charm >&2 || true
          exit 1
        fi
        CHARM_PATH="$(readlink -f "$CHARM_FILE")"
        echo "path=$CHARM_PATH" >> "$GITHUB_OUTPUT"

    - name: Install concierge
      run: sudo snap install --classic concierge

    - name: Prepare with concierge
      # Concierge now provisions the substrate (LXD / MicroK8s / Canonical
      # K8s), installs Juju from 4.1/edge (channel is set in each config), and
      # bootstraps the controller -- replacing the old canonical/setup-lxd +
      # balchua/microk8s-actions + `snap install juju` + hand-rolled `juju
      # bootstrap` steps.
      #
      # The per-cloud config files (.github/concierge-<cloud>.yaml) hold the
      # static provider settings. The dynamic, per-matrix-job bootstrap args
      # (controller charm path, and for LXD the bootstrap base) can't live in
      # a static file, so we append them as `extra-bootstrap-args` to a copy
      # of the config here. `extra-bootstrap-args` is appended verbatim to
      # every `juju bootstrap` concierge runs, exactly reproducing the flags
      # the previous per-cloud bootstrap steps passed:
      #   lxd:      --bootstrap-base=<base> --controller-charm-path=<path>
      #   microk8s: --controller-charm-path=<path>   (base is IAAS-only)
      #   k8s:      --controller-charm-path=<path>
      run: |
        CONFIG="$(mktemp --suffix=.yaml)"
        cp ".github/concierge-${{ matrix.cloud }}.yaml" "$CONFIG"

        BOOTSTRAP_ARGS="--controller-charm-path=${{ steps.charm.outputs.path }}"
        # --bootstrap-base is IAAS-only; only pass it on LXD, matching the
        # previous behaviour where MicroK8s/K8s deliberately omitted it.
        if [ "${{ matrix.cloud }}" = "lxd" ]; then
          BOOTSTRAP_ARGS="--bootstrap-base=${{ matrix.bootstrap_base }} $BOOTSTRAP_ARGS"
        fi

        # `extra-bootstrap-args` lives under the top-level `juju:` block, which
        # every config file already defines.
        printf '  extra-bootstrap-args: %s\n' "$BOOTSTRAP_ARGS" >> "$CONFIG"

        echo "::group::Effective concierge config"
        cat "$CONFIG"
        echo "::endgroup::"

        sudo concierge prepare -v -c "$CONFIG"

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

    - name: Run integration tests
      # test_prometheus.py is marked `prometheus` because it needs a
      # Kubernetes cloud to deploy prometheus-k8s into. Only microk8s
      # provides that here, so deselect the marker on every other cloud via
      # pytest's `-m` option instead of maintaining two separate steps.
      #
      # --log-cli-level=DEBUG enables Jubilant's verbose logging (see the
      # [tool.pytest.ini_options] log_cli_format in pyproject.toml), see:
      # https://canonical.com/juju/docs/ops/latest/howto/write-integration-tests-for-a-charm/#example-of-verbose-logging
      #
      # --log-file writes the same verbose logs to a file so they're
      # available as a build artifact even when the step succeeds (the
      # console output above is trimmed/collapsed in the GitHub UI), see:
      # https://canonical.com/juju/docs/ops/latest/howto/write-integration-tests-for-a-charm/#log-to-a-file
      #
      # --juju-dump-logs saves the full `juju debug-log` output for every
      # model created by the `juju`/`juju_factory` fixtures, see:
      # https://canonical.com/juju/docs/ops/latest/howto/write-integration-tests-for-a-charm/#view-juju-debug-log-logs
      run: |
        MARKEXPR="not prometheus"
        if [ "${{ matrix.cloud }}" = "microk8s" ] || [ "${{ matrix.cloud }}" = "k8s" ]; then
          MARKEXPR=""
        fi
        mkdir -p logs
        uv run --extra integration pytest tests/integration/ -vv \
          --log-cli-level=DEBUG \
          --log-file=logs/verbose.log \
          --juju-dump-logs=logs/juju-debug-log \
          ${MARKEXPR:+-m "$MARKEXPR"}

    - name: Upload integration test logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: integration-test-logs-${{ matrix.test_name }}
        path: logs

    # TODO: test integration with dashboard / ha-proxy
    # TODO: re-introduce the Jubilant-based integration tests
    # (tests/integration/) once they're revisited.
