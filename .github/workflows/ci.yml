name: "CI"
on:
  push:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag, or SHA to build and test. Leave empty to test the ref
          this workflow is running from. Use this to test a branch that
          doesn't have this CI workflow (or tests/integration/) at all --
          dispatch from a branch that does (e.g. main) and point `ref` at
          the other branch. Only unit-tests/build check out this ref; the
          integration job checks out the workflow's own ref and only
          consumes the charm artifact built from it (see below).
        required: false
        type: string
env:
  CHARM_NAME: ${{ vars.CHARM_NAME }}
  # Ref whose charm code / pyproject.toml / charmcraft.yaml gets built and
  # unit-tested. NOT used by the integration job -- see its checkout step.
  TEST_REF: ${{ inputs.ref || github.ref }}

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    # Checks out TEST_REF (the branch under test), not necessarily this
    # workflow's own ref -- see the workflow_dispatch `ref` input above.
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: ${{ env.TEST_REF }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: pip install uv

    - name: Create uv virtualenv
      run: uv venv

    - name: Install dependencies for testing
      run: |
        source .venv/bin/activate
        uv pip install ".[dev]"

    - name: Run tests
      run: |
        source .venv/bin/activate
        ./run_tests

  build:
    name: Build charm
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      # Same as unit-tests: builds whatever charm code lives at TEST_REF.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_REF }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Set up LXD
        uses: canonical/setup-lxd@90d76101915da56a42a562ba766b1a77019242fd

      - name: Add runner to lxd group
        run: |
          sudo usermod -a -G lxd $USER
          newgrp lxd

      - name: Install charmcraft
        # We use latest because there's no 4.x track yet.
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Pack charm
        run: sg lxd -c "charmcraft pack"

      - name: Upload charm artifact
        uses: actions/upload-artifact@v4
        with:
          name: charm
          path: "*.charm"

  integration:
    name: "Integration tests (${{ matrix.test_name }})"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: lxd-22.04
            cloud: lxd
            bootstrap_base: ubuntu@22.04
          - test_name: lxd-24.04
            cloud: lxd
            bootstrap_base: ubuntu@24.04
          - test_name: lxd-26.04
            cloud: lxd
            bootstrap_base: ubuntu@26.04
          - test_name: microk8s
            cloud: microk8s
            # CAAS bootstrap rejects --bootstrap-base entirely (it's an
            # IAAS-only flag), so this is only used below to pick which
            # packed charm artifact to upload, not passed to `juju bootstrap`.
            bootstrap_base: ubuntu@24.04
          - test_name: k8s
            cloud: k8s
            bootstrap_base: ubuntu@24.04
    # NOTE: local --controller-charm-path used to be hard-rejected on k8s
    # clouds ( "deploying a local controller charm on a k8s controller not
    # supported", see juju/juju#14586). That restriction was lifted by
    # juju/juju#22795 ("feat: bootstrap controller charm on CAAS"), which
    # landed after the 4.1-beta1 build. We install Juju from 4.1/edge below
    # to pick up that fix.

    steps:
    # NOTE: deliberately checks out the *workflow's own* ref here, not
    # ${{ env.TEST_REF }}. This job only needs tests/integration/ and the
    # `integration` extra in pyproject.toml, which live on the branch this
    # workflow file itself lives on. The actual charm under test comes
    # entirely from the `charm` artifact built by the `build` job (from
    # TEST_REF), so this job never depends on the target branch having any
    # test files.
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download packed charm
      id: download
      uses: actions/download-artifact@v4
      with:
        name: charm

    - name: Save charmcraft logs as artifact
      if: always() && steps.charmcraft.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: charmcraft-upload-logs-${{ matrix.test_name }}
        path: ~/.local/state/charmcraft/log/
      continue-on-error: true

    - name: Setup LXD
      if: matrix.cloud == 'lxd'
      uses: canonical/setup-lxd@2fa6235ef2dfd3288e0de09edac03f2ebf922968

    - name: Set up MicroK8s
      if: matrix.cloud == 'microk8s'
      uses: balchua/microk8s-actions@65ff1f88f8ecd153879a9b6955659f3144b27714 # v0.4.2
      with:
        channel: "1.36-strict/stable"
        addons: '["dns", "hostpath-storage"]'

    - name: Install Juju
      if: matrix.cloud == 'microk8s' || matrix.cloud == 'lxd'
      # 4.1/beta is 4.1-beta1 (2026-05-01), which predates juju/juju#22795
      # (merged after that build) that allows a local --controller-charm-path
      # on k8s controllers. Use 4.1/edge to get that fix.
      run: |
        sudo snap install juju --channel 4.1/edge

    # Clean this up later
    - if: matrix.cloud == 'k8s'
      run: sudo snap install --classic concierge

    - if: matrix.cloud == 'k8s'
      run: >
        sudo concierge prepare
        --juju-channel=4.1/edge
        -c .github/concierge-k8s.yaml

    - name: Find packed charm path
      id: charm
      # The build job packs one .charm per platform declared in
      # charmcraft.yaml (e.g. juju-controller_ubuntu@22.04-amd64.charm). Pick
      # the file matching *this* matrix job's base, instead of just grabbing
      # the alphabetically-first .charm file (which would silently bootstrap
      # every base with the 22.04 build).
      run: |
        BASE="${{ matrix.bootstrap_base }}"
        CHARM_FILE="$(ls -1 juju-controller_${BASE}-*.charm | head -n1)"
        if [[ -z "$CHARM_FILE" ]]; then
          echo "No packed charm found for base ${BASE}" >&2
          ls -1 *.charm >&2 || true
          exit 1
        fi
        CHARM_PATH="$(readlink -f "$CHARM_FILE")"
        echo "path=$CHARM_PATH" >> "$GITHUB_OUTPUT"

    - name: Bootstrap on LXD
      if: matrix.cloud == 'lxd'
      run: |
        juju bootstrap lxd c \
          --bootstrap-base=${{ matrix.bootstrap_base }} \
          --controller-charm-path=${{ steps.charm.outputs.path }}

    - name: Bootstrap on MicroK8s
      if: matrix.cloud == 'microk8s'
      # --bootstrap-base is IAAS-only and is rejected outright on CAAS
      # clouds, so it's deliberately omitted here.
      run: |
        sg snap_microk8s -c "juju bootstrap microk8s c --controller-charm-path=${{ steps.charm.outputs.path }}"

    - name: Bootstrap on Canonical K8s
      if: matrix.cloud == 'k8s'
      run: |
        juju bootstrap k8s c --controller-charm-path=${{ steps.charm.outputs.path }}

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

    - name: Run integration tests
      # test_prometheus.py is marked `prometheus` because it needs a
      # Kubernetes cloud to deploy prometheus-k8s into. Only microk8s
      # provides that here, so deselect the marker on every other cloud via
      # pytest's `-m` option instead of maintaining two separate steps.
      run: |
        MARKEXPR="not prometheus"
        if [ "${{ matrix.cloud }}" = "microk8s" ] || [ "${{ matrix.cloud }}" = "k8s" ]; then
          MARKEXPR=""
        fi
        uv run --extra integration pytest tests/integration/ -vv --log-cli-level=INFO ${MARKEXPR:+-m "$MARKEXPR"}

    # TODO: test integration with dashboard / ha-proxy
    # TODO: re-introduce the Jubilant-based integration tests
    # (tests/integration/) once they're revisited.
