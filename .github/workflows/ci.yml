name: "CI"
# We don't run this workflow on 'pull_request', because we require secrets to
# upload the charm to Charmhub, and pull_request runs can't access secrets.
# PRs should be opened from a branch on the main juju/juju-controller repo,
# not from a fork.
on:
  push:
  workflow_dispatch:
env:
  CHARM_NAME: ${{ vars.CHARM_NAME }}

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    container:
      image: python:${{ matrix.python }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run lint
        run: make lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.14"]
    container:
      image: python:${{ matrix.python }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run test
        run: make unit

  build:
    name: Build charm
    needs: [lint, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install concierge
        run: sudo snap install --classic concierge

      - name: Prepare with concierge
        run: sudo concierge prepare -v -c ".github/concierge-pack.yaml"

      - name: Pack charm
        run: charmcraft pack

      - name: Upload charm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: charm
          path: "*.charm"

  integration:
    name: Integration tests (${{ matrix.test_name }})
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: lxd-22.04
            cloud: lxd
            bootstrap_base: ubuntu@22.04
          - test_name: lxd-24.04
            cloud: lxd
            bootstrap_base: ubuntu@24.04
          - test_name: lxd-26.04
            cloud: lxd
            bootstrap_base: ubuntu@26.04
          # - test_name: microk8s
          #   cloud: microk8s
          #   bootstrap_base: ubuntu@24.04
          - test_name: k8s
            cloud: k8s
            bootstrap_base: ubuntu@24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Download packed charm
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: charm
        path: charms

    - name: Install concierge
      run: sudo snap install --classic concierge

    - name: Prepare with concierge
      # Concierge installs/configures the substrate (LXD / MicroK8s /
      # Canonical K8s) and Juju here. It does NOT bootstrap a
      # controller.
      run: sudo concierge prepare -v -c ".github/concierge-${{ matrix.cloud }}.yaml"

    - name: Bootstrap Juju controller on LXD
      if: matrix.cloud == 'lxd'
      # Concierge's LXD provider registers Juju's "localhost" cloud.
      run: |
        juju bootstrap localhost "concierge-lxd" \
          --bootstrap-base=${{ matrix.bootstrap_base }} \
          --controller-charm-path "$GITHUB_WORKSPACE/charms/juju-controller_${{ matrix.bootstrap_base }}-amd64.charm"

    - name: Bootstrap Juju controller on Canonical k8s
      if: matrix.cloud == 'k8s'
      run: |
        juju bootstrap k8s "concierge-k8s" \
          --controller-charm-path "$GITHUB_WORKSPACE/charms/juju-controller_${{ matrix.bootstrap_base }}-amd64.charm"

    - name: Bootstrap Juju controller on MicroK8s
      if: matrix.cloud == 'microk8s'
      run: |
        juju bootstrap microk8s "concierge-microk8s" \
          --controller-charm-path "$GITHUB_WORKSPACE/charms/juju-controller_${{ matrix.bootstrap_base }}-amd64.charm"

    - name: Install uv
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

    - name: Run smoke integration tests
      run: |
        juju switch "concierge-${{ matrix.cloud }}"
        uv run --group integration pytest tests/integration -v \
          --log-cli-level=INFO

    - name: Get some info for debugging
      if: failure()
      run: |
        set -x
        set +e
        juju status -m controller
        juju debug-log -m controller --replay | tee logs/controller-debug-log.txt

