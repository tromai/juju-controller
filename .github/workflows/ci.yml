name: "CI"
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  CHARM_NAME: ${{ vars.CHARM_NAME }}

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: pip install uv

    - name: Create uv virtualenv
      run: uv venv

    - name: Install dependencies for testing
      run: |
        source .venv/bin/activate
        uv pip install ".[dev]"

    - name: Run tests
      run: |
        source .venv/bin/activate
        ./run_tests

  build:
    name: Build charm
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Set up LXD
        uses: canonical/setup-lxd@90d76101915da56a42a562ba766b1a77019242fd

      - name: Add runner to lxd group
        run: |
          sudo usermod -a -G lxd $USER
          newgrp lxd

      - name: Install charmcraft
        # We use latest because there's no 4.x track yet.
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Pack charm
        run: sg lxd -c "charmcraft pack"

      - name: Upload charm artifact
        uses: actions/upload-artifact@v4
        with:
          name: charm
          path: "*.charm"

  integration:
    name: "Integration tests (${{ matrix.test_name }})"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: lxd-22.04
            cloud: lxd
            bootstrap_base: ubuntu@22.04
          - test_name: lxd-24.04
            cloud: lxd
            bootstrap_base: ubuntu@24.04
          - test_name: lxd-26.04
            cloud: lxd
            bootstrap_base: ubuntu@26.04
          - test_name: microk8s
            cloud: microk8s

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download packed charm
      id: download
      uses: actions/download-artifact@v4
      with:
        name: charm

    - name: Save charmcraft logs as artifact
      if: always() && steps.charmcraft.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: charmcraft-upload-logs-${{ matrix.test_name }}
        path: ~/.local/state/charmcraft/log/
      continue-on-error: true

    - name: Setup LXD
      if: matrix.cloud == 'lxd'
      uses: canonical/setup-lxd@2fa6235ef2dfd3288e0de09edac03f2ebf922968

    - name: Set up MicroK8s
      if: matrix.cloud == 'microk8s'
      uses: balchua/microk8s-actions@v0.4.2
      with:
        channel: "1.36-strict/stable"
        addons: '["dns", "hostpath-storage"]'

    - name: Install Juju
      run: |
        sudo snap install juju --channel 4.1/beta

    - name: Find packed charm path
      id: charm
      run: |
        CHARM_PATH="$(readlink -f "$(ls -1 *.charm | head -n1)")"
        echo "path=$CHARM_PATH" >> "$GITHUB_OUTPUT"

    - name: Set up Python for Jubilant tests
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: pip install uv

    - name: Create uv virtualenv
      run: uv venv

    - name: Install Jubilant test dependencies
      run: |
        source .venv/bin/activate
        uv pip install ".[integration]"

    # Bootstrapping the controller and waiting for it to go active now happens
    # inside the `controller` fixture in tests/integration/conftest.py (via
    # Jubilant), rather than as separate shell steps here.
    #
    # NOTE: while we're validating this setup, only the simplest test module
    # (test_config.py, which needs no extra charm deploys/relations) is run.
    # Once that's confirmed working, drop the explicit path to run the whole
    # tests/integration suite.
    - name: Run Jubilant integration tests
      env:
        JUJU_CONTROLLER_CHARM_PATH: ${{ steps.charm.outputs.path }}
        JUJU_ITEST_CLOUD: ${{ matrix.cloud }}
        JUJU_ITEST_BOOTSTRAP_BASE: ${{ matrix.bootstrap_base }}
        JUJU_ITEST_CONTROLLER_NAME: c
        JUJU_ITEST_KEEP_CONTROLLER: "1"
      run: |
        source .venv/bin/activate
        mkdir -p logs
        if [[ "${{ matrix.cloud }}" == "microk8s" ]]; then
          sg snap_microk8s -c "pytest tests/integration/test_config.py -v --log-cli-level=INFO --log-file logs/verbose.log"
        else
          pytest tests/integration/test_config.py -v --log-cli-level=INFO --log-file logs/verbose.log
        fi

    - name: Upload Jubilant integration test logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jubilant-integration-logs-${{ matrix.test_name }}
        path: logs/verbose.log
      continue-on-error: true

    - name: Get some info for debugging
      if: failure()
      run: |
        set -x
        set +e
        juju status -m c:controller
        juju debug-log -m c:controller --replay
        if [[ "${{ matrix.cloud }}" == "microk8s" ]]; then
          sg snap_microk8s <<EOF
            microk8s.kubectl -n controller-c get all
            microk8s.kubectl -n controller-c get -o yaml pod/controller-0
          EOF
        fi

    # TODO: test integration with dashboard / ha-proxy
    # TODO: once the above is confirmed working, drop the explicit
    # test_config.py path above and run the full tests/integration suite.
