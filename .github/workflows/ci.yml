name: "CI"
on:
  push:
  workflow_dispatch:
env:
  CHARM_NAME: ${{ vars.CHARM_NAME }}

jobs:

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install uv
      run: pip install uv

    - name: Create uv virtualenv
      run: uv venv

    - name: Install dependencies for testing
      run: |
        source .venv/bin/activate
        uv pip install ".[dev]"

    - name: Run tests
      run: |
        source .venv/bin/activate
        ./run_tests

  build:
    name: Build charm
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Set up LXD
        uses: canonical/setup-lxd@90d76101915da56a42a562ba766b1a77019242fd

      - name: Add runner to lxd group
        run: |
          sudo usermod -a -G lxd $USER
          newgrp lxd

      - name: Install charmcraft
        # We use latest because there's no 4.x track yet.
        run: sudo snap install charmcraft --classic --channel=latest/stable

      - name: Pack charm
        run: sg lxd -c "charmcraft pack"

      - name: Upload charm artifact
        uses: actions/upload-artifact@v4
        with:
          name: charm
          path: "*.charm"

  integration:
    name: "Integration tests (${{ matrix.test_name }})"
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - test_name: lxd-22.04
            cloud: lxd
            bootstrap_base: ubuntu@22.04
          - test_name: lxd-24.04
            cloud: lxd
            bootstrap_base: ubuntu@24.04
          - test_name: lxd-26.04
            cloud: lxd
            bootstrap_base: ubuntu@26.04
    # NOTE: microk8s is intentionally excluded for now. Juju rejects
    # --controller-charm-path on k8s clouds unless it's a Charmhub reference
    # (ch:...); a local .charm path is hard-rejected with "deploying a local
    # controller charm on a k8s controller not supported". Since this fork
    # has no Charmhub upload credentials, there's no way to exercise the
    # microk8s bootstrap path here. See juju/juju#14586 for the origin of
    # this restriction.

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download packed charm
      id: download
      uses: actions/download-artifact@v4
      with:
        name: charm

    - name: Save charmcraft logs as artifact
      if: always() && steps.charmcraft.outcome != 'skipped'
      uses: actions/upload-artifact@v4
      with:
        name: charmcraft-upload-logs-${{ matrix.test_name }}
        path: ~/.local/state/charmcraft/log/
      continue-on-error: true

    - name: Setup LXD
      uses: canonical/setup-lxd@2fa6235ef2dfd3288e0de09edac03f2ebf922968

    - name: Install Juju
      run: |
        sudo snap install juju --channel 4.1/beta

    - name: Find packed charm path
      id: charm
      # The build job packs one .charm per platform declared in
      # charmcraft.yaml (e.g. juju-controller_ubuntu@22.04-amd64.charm). Pick
      # the file matching *this* matrix job's base, instead of just grabbing
      # the alphabetically-first .charm file (which would silently bootstrap
      # every base with the 22.04 build).
      run: |
        BASE="${{ matrix.bootstrap_base }}"
        CHARM_FILE="$(ls -1 juju-controller_${BASE}-*.charm | head -n1)"
        if [[ -z "$CHARM_FILE" ]]; then
          echo "No packed charm found for base ${BASE}" >&2
          ls -1 *.charm >&2 || true
          exit 1
        fi
        CHARM_PATH="$(readlink -f "$CHARM_FILE")"
        echo "path=$CHARM_PATH" >> "$GITHUB_OUTPUT"

    - name: Bootstrap on LXD
      run: |
        juju bootstrap lxd c \
          --bootstrap-base=${{ matrix.bootstrap_base }} \
          --controller-charm-path=${{ steps.charm.outputs.path }}

    - name: Check charm status
      run: |
        juju switch controller
        juju status

        start_time="$(date -u +%s)"
        until [[ $(juju status --format=json 2>/dev/null | jq -r '.applications.controller["application-status"].current') == "active" ]]; do
          echo "Waiting for controller to become active..."
          juju status
          sleep 10

          elapsed=$(( $(date -u +%s) - start_time ))
          if [[ ${elapsed} -ge 600 ]]; then
            echo "Timed out waiting for controller to become active"
            juju status
            exit 1
          fi
        done

    - name: Get some info for debugging
      if: failure()
      run: |
        set -x
        set +e
        juju status -m controller
        juju debug-log -m controller --replay

    # TODO: test integration with dashboard / ha-proxy
    # TODO: re-introduce the Jubilant-based integration tests
    # (tests/integration/) once they're revisited.
