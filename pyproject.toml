[project]
name = "juju-controller"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
    "ops",
    "charmhelpers",
    "cosl",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "flake8",
]
integration = [
    "jubilant",
    "pytest",
    "pytest-jubilant",
    "pyyaml",
]

# Configure Jubilant logs for integration tests, following:
# https://canonical.com/juju/docs/ops/latest/howto/write-integration-tests-for-a-charm/#configure-jubilant-logs
[tool.pytest.ini_options]
log_cli_format = "%(levelname)s %(name)s %(message)s"

log_file_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%SZ"
