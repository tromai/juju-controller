[project]
name = "juju-controller"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ops",
    "cosl",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "ruff",
]
integration = [
    "jubilant",
    "pytest",
    "pytest-jubilant",
    "pyyaml",
]

[tool.ruff]
target-version = "py310"
line-length = 99
extend-exclude = [
    ".venv",
    ".git",
    "build",
    "dist",
    "*.egg_info",
    "lib",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E", "W", "F", "C901", "N",
    "unsorted-imports",  # I001
    "UP",  # Upgrade Python syntax
]
ignore = [
    # This rule wants exception classes to be named with an "Error"
    # suffix. This repo widely uses the "Exception" suffix.
    # We ignore it rather than renaming all of them.
    "N818",  # error-suffix-on-exception-name
]

# Configure Jubilant logs for integration tests, following the "verbose
# logging" example from:
# https://canonical.com/juju/docs/ops/latest/howto/write-integration-tests-for-a-charm/#example-of-verbose-logging
#
# Verbose logging requires the pytest invocation to pass --log-cli-level=DEBUG
# (see the `Run integration tests` step in .github/workflows/ci.yml).
[tool.pytest.ini_options]
markers = [
    "prometheus: needs a Kubernetes cloud to deploy prometheus-k8s into (e.g. microk8s)",
]

log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%SZ"

log_file_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%SZ"
