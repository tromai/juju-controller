[project]
name = "juju-controller"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "ops",
    "cosl",
]

[project.optional-dependencies]
dev = [
    "coverage",
    "ruff",
]

[dependency-groups]
# Integration test dependencies, used with `uv run --group integration ...`.
integration = [
    "jubilant>=1.12",
    "pytest",
    "pytest-jubilant>=2.2",
]

[tool.ruff]
target-version = "py310"
line-length = 99
extend-exclude = [
    ".venv",
    ".git",
    "build",
    "dist",
    "*.egg_info",
    "lib",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = [
    "E", "W", "F", "C901", "N",
    "unsorted-imports",  # I001
    "UP",  # Upgrade Python syntax
]
ignore = [
    # This rule wants exception classes to be named with an "Error"
    # suffix. This repo widely uses the "Exception" suffix.
    # We ignore it rather than renaming all of them.
    "N818",  # error-suffix-on-exception-name
]

# Configure Jubilant logs for integration tests, following:
# https://canonical.com/juju/docs/ops/latest/howto/write-integration-tests-for-a-charm/#configure-jubilant-logs
# Pass --log-cli-level=INFO (or DEBUG, for status diffs) to see them live, and
# --log-file=<path> to keep them.
[tool.pytest.ini_options]
markers = [
    "prometheus: ports of juju/juju's controllercharm/prometheus.sh; deploy prometheus-k8s",
]

log_cli_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%SZ"

log_file_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%SZ"
