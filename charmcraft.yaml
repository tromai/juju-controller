name: juju-controller
title: Juju Controller Charm
description: |
  The Juju controller charm is used to expose various pieces
  of functionality of a Juju controller.
summary: |
  The Juju controller.
type: charm

links:
  issues:
    - https://github.com/juju/juju-controller/issues
  source:
    - https://github.com/juju/juju-controller

assumes:
- juju >= 4.1

provides:
  dashboard:
    interface: juju-dashboard
    optional: true
  website:
    interface: http
    optional: true
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true

requires:
  charm-tracing:
    interface: tracing
    limit: 1
    optional: true
  charm-tracing-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true
  workload-tracing:
    interface: tracing
    limit: 1
    optional: true
  workload-tracing-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true
  s3-backend:
    interface: s3
    limit: 1
    optional: true
  loki-push-api:
    interface: loki_push_api
    limit: 1
    optional: true
  loki-push-api-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true

peers:
  dbcluster:
    interface: dbcluster

parts:
  charm:
    plugin: uv
    source: .
    build-packages: [git]
    build-snaps: [astral-uv]

platforms:
  ubuntu@22.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@22.04:s390x:
  ubuntu@22.04:ppc64el:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:
  ubuntu@24.04:s390x:
  ubuntu@24.04:ppc64el:
  ubuntu@24.04:riscv64:
  ubuntu@26.04:amd64:
  ubuntu@26.04:arm64:
  ubuntu@26.04:s390x:
  ubuntu@26.04:ppc64el:
  ubuntu@26.04:riscv64:

charm-libs:
  - lib: prometheus_k8s.prometheus_scrape
    version: "0"
  - lib: tempo_coordinator_k8s.tracing
    version: "0"
  - lib: certificate_transfer_interface.certificate_transfer
    version: "1"
  - lib: data_platform_libs.s3
    version: "0"
  - lib: loki_k8s.loki_push_api
    version: "1"
