name: juju-controller
title: Juju Controller Charm
description: |
  The Juju controller charm is used to expose various pieces
  of functionality of a Juju controller.
summary: |
  The Juju controller.
type: charm

links:
  issues:
    - https://github.com/juju/juju-controller/issues
  source:
    - https://github.com/juju/juju-controller

assumes:
- juju >= 4.0

provides:
  dashboard:
    interface: juju-dashboard
    optional: false
  website:
    interface: http
    optional: false
  metrics-endpoint:
    interface: prometheus_scrape
    optional: false

requires:
  charm-tracing:
    interface: tracing
    limit: 1
    optional: true
  charm-tracing-ca-cert:
    interface: certificate_transfer
    limit: 1
    optional: true

peers:
  dbcluster:
    interface: dbcluster

parts:
  charm:
    plugin: uv
    source: .
    build-packages: [git]
    build-snaps: [astral-uv]

platforms:
  ubuntu@22.04:amd64:
  ubuntu@22.04:arm64:
  ubuntu@22.04:s390x:
  ubuntu@22.04:ppc64el:
  ubuntu@24.04:amd64:
  ubuntu@24.04:arm64:
  ubuntu@24.04:s390x:
  ubuntu@24.04:ppc64el:
  ubuntu@24.04:riscv64:
  ubuntu@26.04:amd64:
  ubuntu@26.04:arm64:
  ubuntu@26.04:s390x:
  ubuntu@26.04:ppc64el:
  ubuntu@26.04:riscv64:

charm-libs:
  - lib: prometheus_k8s.prometheus_scrape
    version: "0"
  - lib: tempo_coordinator_k8s.tracing
    version: "0"
  - lib: certificate_transfer_interface.certificate_transfer
    version: "1"

config:
  options:
    controller-url:
      default: ""
      description: The URL used to access the controller API.
      type: string
    identity-provider-url:
      default: ""
      description: The URL used to access an external identity provider.
      type: string
    is-juju:
      default: true
      description: Whether this is a standalone Juju controller
      type: boolean